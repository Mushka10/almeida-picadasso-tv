name: Compilar APK AlmeidaPiçadasso

on:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Aceder ao Código
        uses: actions/checkout@v4

      - name: Configurar Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Instalar Android SDK e Ferramentas de Compilação
        uses: android-actions/setup-android@v3

      - name: Criar Projeto Android Direto
        run: |
          mkdir -p app/src/main/res/values
          mkdir -p app/src/main/java/com/almeida/picadassotv

          cat << 'EOF' > gradle.properties
          android.useAndroidX=true
          android.enableJetifier=true
          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
          org.gradle.unsafe.isolated-projects=false
          EOF

          cat << 'EOF' > app/build.gradle.kts
          plugins {
              id("com.android.application") version "8.2.0"
              id("org.jetbrains.kotlin.android") version "1.9.20"
          }
          android {
              namespace = "com.almeida.picadassotv"
              compileSdk = 34
              defaultConfig {
                  applicationId = "com.almeida.picadassotv"
                  minSdk = 26
                  targetSdk = 34
                  versionCode = 1
                  versionName = "1.0-Ultimate"
              }
              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_11
                  targetCompatibility = JavaVersion.VERSION_11
              }
              kotlinOptions { jvmTarget = "11" }
          }
          dependencies {
              implementation("androidx.core:core-ktx:1.12.0")
              implementation("androidx.appcompat:appcompat:1.6.1")
              implementation("com.google.android.material:material:1.11.0")
          }
          EOF

          cat << 'EOF' > app/src/main/AndroidManifest.xml
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.INTERNET" />
              <application
                  android:allowBackup="true"
                  android:icon="@android:drawable/ic_menu_play_clip"
                  android:roundIcon="@android:drawable/ic_menu_play_clip"
                  android:label="AlmeidaPiçadasso TV"
                  android:usesCleartextTraffic="true">
                  <activity android:name=".MainActivity" android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF

          cat << 'EOF' > app/src/main/java/com/almeida/picadassotv/MainActivity.kt
          package com.almeida.picadassotv
          import android.os.Bundle
          import android.widget.TextView
          import android.graphics.Color
          import android.view.Gravity
          import androidx.appcompat.app.AppCompatActivity

          class MainActivity : AppCompatActivity() {
              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  val tv = TextView(this).apply {
                      text = "⚡ ALMEIDAPIÇADASSO TV ULTIMATE ⚡\n\nSistema VIP Ativo & Pronto a Transmitir!"
                      textSize = 22f
                      setTextColor(Color.parseColor("#FFD700"))
                      gravity = Gravity.CENTER
                      setBackgroundColor(Color.parseColor("#070A12"))
                  }
                  setContentView(tv)
              }
          }
          EOF

          cat << 'EOF' > build.gradle.kts
          plugins {
              id("com.android.application") version "8.2.0" apply false
              id("org.jetbrains.kotlin.android") version "1.9.20" apply false
          }
          EOF

          cat << 'EOF' > settings.gradle.kts
          pluginManagement { repositories { google(); mavenCentral(); gradlePluginPortal() } }
          dependencyResolutionManagement { repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS); repositories { google(); mavenCentral() } }
          rootProject.name = "AlmeidaPicadassoTV"
          include(":app")
          EOF

          # Cria o gradlew de forma compatível
          echo "distributionBase=GRADLE_USER_HOME" > gradle/wrapper/gradle-wrapper.properties
          echo "distributionPath=wrapper/dists" >> gradle/wrapper/gradle-wrapper.properties
          echo "distributionUrl=https\://services.gradle.org/distributions/gradle-8.5-bin.zip" >> gradle/wrapper/gradle-wrapper.properties
          echo "zipStoreBase=GRADLE_USER_HOME" >> gradle/wrapper/gradle-wrapper.properties
          echo "zipStorePath=wrapper/dists" >> gradle/wrapper/gradle-wrapper.properties

      - name: Compilar APK com Gradle 8.5
        run: |
          gradle wrapper --gradle-version 8.5
          ./gradlew assembleDebug

      - name: Guardar Ficheiro APK Gerado
        uses: actions/upload-artifact@v4
        with:
          name: AlmeidaPicadasso-APK
          path: app/build/outputs/apk/debug/app-debug.apk
