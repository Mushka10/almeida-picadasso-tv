name: Compilar APK AlmeidaPiçadasso

on:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Aceder ao Código
        uses: actions/checkout@v4

      - name: Configurar Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Criar Projeto Android Mínimo Automático
        run: |
          echo "A preparar estrutura Android..."
          mkdir -p app/src/main/res/drawable app/src/main/java/com/almeida/picadassotv
          
          # Copia a imagem se existir para a pasta correta
          if [ -f "almeida_mascote.jpg" ]; then
            cp almeida_mascote.jpg app/src/main/res/drawable/almeida_mascote.jpg
          fi

          # Criar build.gradle.kts do Módulo App
          cat << 'EOF' > app/build.gradle.kts
          plugins {
              id("com.android.application")
              id("org.jetbrains.kotlin.android")
          }
          android {
              namespace = "com.almeida.picadassotv"
              compileSdk = 34
              defaultConfig {
                  applicationId = "com.almeida.picadassotv"
                  minSdk = 26
                  targetSdk = 34
                  versionCode = 1
                  versionName = "1.0-VIP"
              }
              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_11
                  targetCompatibility = JavaVersion.VERSION_11
              }
              kotlinOptions { jvmTarget = "11" }
          }
          dependencies {
              implementation("androidx.core:core-ktx:1.12.0")
              implementation("androidx.appcompat:appcompat:1.6.1")
              implementation("androidx.media3:media3-exoplayer:1.3.1")
              implementation("androidx.media3:media3-ui:1.3.1")
          }
          EOF

          # Criar AndroidManifest.xml
          cat << 'EOF' > app/src/main/AndroidManifest.xml
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.INTERNET" />
              <application android:label="AlmeidaPiçadasso TV" android:icon="@drawable/almeida_mascote" android:usesCleartextTraffic="true">
                  <activity android:name=".MainActivity" android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF

          # Criar MainActivity.kt base
          cat << 'EOF' > app/src/main/java/com/almeida/picadassotv/MainActivity.kt
          package com.almeida.picadassotv
          import android.os.Bundle
          import android.widget.TextView
          import androidx.appcompat.app.AppCompatActivity
          class MainActivity : AppCompatActivity() {
              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  val tv = TextView(this)
                  tv.text = "⚡ BEM-VINDO AO ALMEIDAPIÇADASSO TV VIP ⚡\nSistema pronto a carregar streams 4K!"
                  tv.textSize = 20f
                  setContentView(tv)
              }
          }
          EOF

          # Criar build.gradle raiz
          cat << 'EOF' > build.gradle.kts
          plugins {
              id("com.android.application") version "8.2.0" apply false
              id("org.jetbrains.kotlin.android") version "1.9.0" apply false
          }
          EOF

          # Criar settings.gradle.kts
          cat << 'EOF' > settings.gradle.kts
          pluginManagement { repositories { google(); mavenCentral(); gradlePluginPortal() } }
          dependencyResolutionManagement { repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS); repositories { google(); mavenCentral() } }
          rootProject.name = "AlmeidaPicadassoTV"
          include(":app")
          EOF

      - name: Compilar APK com Gradle
        run: ./gradlew assembleDebug

      - name: Guardar Ficheiro APK Gerado
        uses: actions/upload-artifact@v4
        with:
          name: AlmeidaPicadasso-APK
          path: app/build/outputs/apk/debug/app-debug.apk
